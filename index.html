<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase タスク管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .task-item {
            transition: all 0.2s ease-in-out;
        }
        .task-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .completed-text {
            text-decoration: line-through;
            color: #9ca3af;
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center">

    <div id="app-container" class="w-full max-w-md bg-white rounded-xl shadow-xl overflow-hidden hidden flex-col h-[80vh]">
        <!-- ヘッダー (ログイン後) -->
        <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md z-10">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-check-square"></i> My Tasks
            </h1>
            <div class="flex items-center gap-3">
                <div class="flex flex-col text-right">
                    <span id="user-name" class="text-sm font-medium"></span>
                    <button id="logout-btn" class="text-xs text-blue-200 hover:text-white hover:underline">ログアウト</button>
                </div>
                <img id="user-photo" src="https://placehold.co/40x40/blue/white?text=U" alt="User Profile" class="w-8 h-8 rounded-full border-2 border-white object-cover">
            </div>
        </header>

        <!-- メインコンテンツ (タスクリスト) -->
        <main class="flex-1 overflow-y-auto p-4 bg-gray-50 relative">
            
            <!-- ローディングインジケーター -->
            <div id="loading-indicator" class="absolute inset-0 bg-gray-50 flex justify-center items-center z-10 hidden">
                <i class="fas fa-spinner fa-spin text-blue-500 text-3xl"></i>
            </div>

            <!-- エラーメッセージ -->
            <div id="error-message" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4 hidden rounded shadow-sm" role="alert">
                <p class="font-bold">エラー</p>
                <p id="error-text">何か問題が発生しました。</p>
            </div>

            <ul id="task-list" class="space-y-3">
                <!-- タスクアイテムはここに動的に追加されます -->
            </ul>
            
            <!-- タスクが空の場合の表示 -->
            <div id="empty-state" class="hidden flex flex-col items-center justify-center h-full text-gray-400 mt-10">
                <i class="fas fa-clipboard-list text-5xl mb-3 text-gray-300"></i>
                <p>タスクがありません。新しいタスクを追加してください！</p>
            </div>
        </main>

        <!-- フッター (タスク入力) -->
        <footer class="p-4 bg-white border-t border-gray-200 z-10">
            <form id="add-task-form" class="flex gap-2 relative">
                <input type="text" id="new-task-input" placeholder="新しいタスクを入力..." class="flex-1 border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow text-gray-700" required>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-5 py-3 transition-colors flex items-center justify-center font-medium shadow-sm active:transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-plus mr-1"></i> 追加
                </button>
            </form>
        </footer>
    </div>

    <!-- ログイン画面 -->
    <div id="login-container" class="w-full max-w-sm bg-white p-8 rounded-xl shadow-xl text-center flex flex-col items-center">
        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mb-6 text-blue-600 text-3xl shadow-sm">
            <i class="fas fa-tasks"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">タスク管理アプリへようこそ</h2>
        <p class="text-gray-500 mb-8 text-sm">タスクを保存して管理するには、Googleでログインしてください。</p>
        
        <button id="google-login-btn" class="w-full bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium py-3 px-4 rounded-lg shadow-sm transition-colors flex items-center justify-center gap-3 active:bg-gray-100">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                <path fill="none" d="M1 1h22v22H1z"/>
            </svg>
            Googleでログイン
        </button>
        
        <div id="login-error" class="mt-4 text-red-500 text-sm hidden">
            ログインに失敗しました。
        </div>
    </div>

    <!-- Firebase SDK (v11) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (Provided by user)
        const firebaseConfig = {
            apiKey: "AIzaSyA54JayaK6rkzq6I1jaeHQTz3gPgltqwSE",
            authDomain: "task10-937e6.firebaseapp.com",
            projectId: "task10-937e6",
            storageBucket: "task10-937e6.firebasestorage.app",
            messagingSenderId: "314773700175",
            appId: "1:314773700175:web:04bf4a58a19777bb3d343a"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Use a generic collection name since we don't have an __app_id in this standalone setup,
        // but we WILL separate tasks by user ID to keep data private.
        const COLLECTION_NAME = "tasks";

        // DOM Elements
        const loginContainer = document.getElementById('login-container');
        const appContainer = document.getElementById('app-container');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userNameDisplay = document.getElementById('user-name');
        const userPhotoDisplay = document.getElementById('user-photo');
        const loginError = document.getElementById('login-error');
        
        const addTaskForm = document.getElementById('add-task-form');
        const newTaskInput = document.getElementById('new-task-input');
        const taskList = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');
        const loadingIndicator = document.getElementById('loading-indicator');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');

        let currentUser = null;
        let unsubscribeTasks = null; // Firestore listener を保持する変数

        // Google ログイン処理
        googleLoginBtn.addEventListener('click', async () => {
            try {
                loginError.classList.add('hidden');
                googleLoginBtn.disabled = true;
                googleLoginBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> ログイン中...';
                
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                // 成功すると onAuthStateChanged がトリガーされます
            } catch (error) {
                console.error("Login error:", error);
                loginError.textContent = `ログインエラー: ${error.message}`;
                loginError.classList.remove('hidden');
                
                // ボタンを元に戻す
                googleLoginBtn.disabled = false;
                googleLoginBtn.innerHTML = `
                    <svg class="w-5 h-5" viewBox="0 0 24 24">...</svg>
                    Googleでログイン
                `;
            }
        });

        // ログアウト処理
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                showError("ログアウトに失敗しました。");
                console.error("Logout error:", error);
            }
        });

        // 認証状態の監視
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ログイン済みの状態
                currentUser = user;
                
                // UIの切り替え
                loginContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                appContainer.classList.add('flex');
                
                // ユーザー情報の表示
                userNameDisplay.textContent = user.displayName || 'ユーザー';
                if (user.photoURL) {
                    userPhotoDisplay.src = user.photoURL;
                }
                
                // タスクの読み込み開始
                loadTasks();
            } else {
                // 未ログインの状態
                currentUser = null;
                
                // リスナーのクリーンアップ
                if (unsubscribeTasks) {
                    unsubscribeTasks();
                    unsubscribeTasks = null;
                }
                
                // UIの切り替え
                appContainer.classList.add('hidden');
                appContainer.classList.remove('flex');
                loginContainer.classList.remove('hidden');
                
                // リストのクリア
                taskList.innerHTML = '';
            }
        });

        
        // エラー表示用ヘルパー
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
            setTimeout(() => {
                errorMessage.classList.add('hidden');
            }, 5000); // 5秒後に消す
        }

        // タスクの読み込み (リアルタイム監視)
        function loadTasks() {
            if (!currentUser) return;

            loadingIndicator.classList.remove('hidden');
            
            // ユーザー固有のパスを作成
            // 例: users/user_uid/tasks
            const tasksRef = collection(db, 'users', currentUser.uid, COLLECTION_NAME);
            
            // 作成日時でソート (Firestore は orderBy をサポートしていますが、
            // 新規作成直後は serverTimestamp が null になる場合があるため、
            // JavaScript側でソートする方が安全な場合があります。
            // しかし、シンプルな構成では orderBy が一般的です。
            // 今回はシンプルにクエリを作成し、JavaScriptでソートして表示します。
            
            // RULE 2: No Complex Queries に従い、全件取得してJSでソート
            
            unsubscribeTasks = onSnapshot(tasksRef, (snapshot) => {
                loadingIndicator.classList.add('hidden');
                taskList.innerHTML = '';
                
                if (snapshot.empty) {
                    emptyState.classList.remove('hidden');
                    return;
                }
                
                emptyState.classList.add('hidden');
                
                // データを配列に変換し、createdAt でソート (新しいもの順)
                const tasks = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    tasks.push({
                        id: doc.id,
                        ...data,
                        // createdAtがまだ無い（ローカルで追加直後）場合は現在時刻を仮設定
                        timestamp: data.createdAt ? data.createdAt.toMillis() : Date.now()
                    });
                });
                
                // ソート (新しいもの上)
                tasks.sort((a, b) => b.timestamp - a.timestamp);
                
                // UIにレンダリング
                tasks.forEach(task => renderTask(task));
                
            }, (error) => {
                console.error("Firestore Listen Error:", error);
                loadingIndicator.classList.add('hidden');
                showError("タスクの読み込みに失敗しました。");
            });
        }

        // タスクのレンダリング関数
        function renderTask(task) {
            const li = document.createElement('li');
            li.className = `task-item bg-white p-4 rounded-lg shadow-sm border border-gray-100 flex items-center justify-between gap-3 ${task.completed ? 'opacity-75 bg-gray-50' : ''}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'flex items-center gap-3 flex-1 overflow-hidden';
            
            // 完了チェックボックス (ボタンとして実装し、スタイリングしやすくする)
            const checkBtn = document.createElement('button');
            checkBtn.className = `w-6 h-6 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-blue-300 ${task.completed ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 text-transparent hover:border-blue-400'}`;
            checkBtn.innerHTML = '<i class="fas fa-check text-xs"></i>';
            checkBtn.onclick = () => toggleTaskCompletion(task.id, task.completed);
            
            // タスクテキスト
            const textSpan = document.createElement('span');
            textSpan.className = `flex-1 truncate ${task.completed ? 'completed-text' : 'text-gray-800'}`;
            textSpan.textContent = task.text;
            
            contentDiv.appendChild(checkBtn);
            contentDiv.appendChild(textSpan);
            
            // 削除ボタン
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'text-gray-400 hover:text-red-500 transition-colors p-2 focus:outline-none rounded-full hover:bg-red-50';
            deleteBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
            deleteBtn.title = '削除';
            deleteBtn.onclick = () => deleteTask(task.id);
            
            li.appendChild(contentDiv);
            li.appendChild(deleteBtn);
            
            taskList.appendChild(li);
        }

        
        // 新しいタスクの追加
        addTaskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = newTaskInput.value.trim();
            
            if (!text || !currentUser) return;
            
            const submitBtn = addTaskForm.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            
            try {
                const tasksRef = collection(db, 'users', currentUser.uid, COLLECTION_NAME);
                await addDoc(tasksRef, {
                    text: text,
                    completed: false,
                    createdAt: serverTimestamp()
                });
                
                newTaskInput.value = '';
            } catch (error) {
                console.error("Error adding document: ", error);
                showError("タスクの追加に失敗しました。");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-plus mr-1"></i> 追加';
                newTaskInput.focus();
            }
        });

        // タスクの完了状態の切り替え
        async function toggleTaskCompletion(taskId, currentStatus) {
            if (!currentUser) return;
            
            try {
                const taskRef = doc(db, 'users', currentUser.uid, COLLECTION_NAME, taskId);
                await updateDoc(taskRef, {
                    completed: !currentStatus
                });
            } catch (error) {
                console.error("Error updating document: ", error);
                showError("タスクの更新に失敗しました。");
            }
        }

        // タスクの削除
        async function deleteTask(taskId) {
            if (!currentUser) return;
            
            // カスタムの確認UIを使いたいところですが、今回はシンプルにすぐに削除します。
            // (iframe内では confirm() は避けるべきルールのため)
            try {
                const taskRef = doc(db, 'users', currentUser.uid, COLLECTION_NAME, taskId);
                await deleteDoc(taskRef);
            } catch (error) {
                console.error("Error deleting document: ", error);
                showError("タスクの削除に失敗しました。");
            }
        }

    </script>
</body>
</html>
